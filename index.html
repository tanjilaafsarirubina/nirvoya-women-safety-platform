<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Nirvoya - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="center-screen">

<div class="container">
    <h2>Nirvoya Login</h2>
    <p class="tagline">Travel safer. Stay connected. Speak up.</p>
    <div id="msg" class="alert" hidden></div>
    <form action="api/login.php" method="POST">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>
    <div class="link">
        Don't have an account? <a href="register.html">Sign Up</a>
    </div>
</div>

<script>
    // Show feedback passed back from api/login.php or api/register.php
    const params = new URLSearchParams(location.search);
    const msg = document.getElementById('msg');
    if (params.get('error') === 'invalid') {
        msg.textContent = "Invalid email or password.";
        msg.className = "alert alert-error";
        msg.hidden = false;
    } else if (params.has('registered')) {
        msg.textContent = "Registration successful! You can log in now.";
        msg.className = "alert alert-success";
        msg.hidden = false;
    }
</script>

</body>
</html>
